    var idx = g_rows.length; d.setAttribute("data-idx", idx); f.appendChild(row1); f.appendChild(row2); f.appendChild(d); ptn.appendChild(f);
    var c = {skuVal:skuStr, precioVal:price, cant:nInp, totalDisp:tInp, totalVal:price, fila:f, del:d}; g_rows.push(c);
    nInp.oninput = function() { g_ts(); g_sv(); }; d.onclick = g_on_del_click; g_ts(); g_sv();
}

function g_on_del_click(e) {
    var idx = parseInt(e.target.getAttribute("data-idx")); var c = g_rows[idx]; if(!c) return;
    g_rows.splice(idx, 1); c.fila.parentNode.removeChild(c.fila);
    for(var j=0; j<g_rows.length; j++) { g_rows[j].del.setAttribute("data-idx", j); }
    g_ts(); g_sv();
}

function g_item_click(e) {
    var v = e.target.getAttribute("data-val"); var type = e.target.getAttribute("data-type");
    if(type === "sku") { g_add_p(v); document.getElementById("buscarSku").value = ""; }
    else if(type === "dep") { document.getElementById("departamento").value = v; document.getElementById("municipio").value = ""; g_sv(); }
    else if(type === "mun") { document.getElementById("municipio").value = v; g_sv(); }
    else if(type === "cat") { document.getElementById("categoria").value = v; }
    e.target.parentNode.style.display = "none";
}

function g_rd(id, items, type) {
    var l = document.getElementById(id); if(!l) return; l.innerHTML = "";
    for(var i=0; i<(items||[]).length; i++) {
        var d = document.createElement("div"); d.className = "combo-item"; d.textContent = items[i];
        d.setAttribute("data-val", items[i]); d.setAttribute("data-type", type); d.onclick = g_item_click; l.appendChild(d);
    }
    l.style.display = (items||[]).length ? "block" : "none";
}

function g_on_sku_focus() {
    var cat = document.getElementById("categoria").value; var items = [];
    for(var i=0; i<g_db.length; i++) { if(!cat || g_db[i].cat === cat) items.push(g_db[i].sku); }
    g_rd("sku-search-list", items, "sku");
}
function g_on_sku_input() {
    var txt = document.getElementById("buscarSku").value.toLowerCase(); var cat = document.getElementById("categoria").value; var items = [];
    for(var i=0; i<g_db.length; i++) { if((!cat || g_db[i].cat === cat) && g_db[i].sku.toLowerCase().indexOf(txt) !== -1) items.push(g_db[i].sku); }
    g_rd("sku-search-list", items, "sku");
}
function g_on_dep_foc() { var d = []; for(var k in g_dm) d.push(k); g_rd("dep-list", d, "dep"); }
function g_on_dep_inp() { var x = document.getElementById("departamento").value.toLowerCase(); var d = []; for(var k in g_dm) if(k.toLowerCase().indexOf(x) !== -1) d.push(k); g_rd("dep-list", d, "dep"); }
function g_on_mun_foc() { var d = document.getElementById("departamento").value; if(g_dm[d]) g_rd("mun-list", g_dm[d], "mun"); }
function g_on_mun_inp() { var d = document.getElementById("departamento").value; var x = document.getElementById("municipio").value.toLowerCase(); if(g_dm[d]) { var m = []; for(var j=0; j<g_dm[d].length; j++) if(g_dm[d][j].toLowerCase().indexOf(x) !== -1) m.push(g_dm[d][j]); g_rd("mun-list", m, "mun"); } }
function g_on_cat_foc() { var cats = []; for(var i=0; i<g_db.length; i++) if(cats.indexOf(g_db[i].cat) === -1) cats.push(g_db[i].cat); g_rd("cat-list", cats, "cat"); }
function g_on_cat_inp() { var x = document.getElementById("categoria").value.toLowerCase(); var cats = []; for(var i=0; i<g_db.length; i++) if(cats.indexOf(g_db[i].cat) === -1 && g_db[i].cat.toLowerCase().indexOf(x) !== -1) cats.push(g_db[i].cat); g_rd("cat-list", cats, "cat"); }

function g_on_tel_inp(e) { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 11); g_sv(); }

function g_vld() {
    var ok = true;
    var req = [{id:"nombre", msg:"Nombre es obligatorio"}, {id:"tel1", msg:"Teléfono 1 es obligatorio (8-11 dígitos)", min:8, max:11}, {id:"fechaVenta", msg:"Fecha de Venta es obligatoria"}, {id:"departamento", msg:"Departamento es obligatorio y debe ser válido", list:Object.keys(g_dm)}, {id:"municipio", msg:"Municipio es obligatorio y debe ser válido", munCheck:true}];
    for(var i=0; i<req.length; i++) {
        var el = document.getElementById(req[i].id); var val = el.value.trim(); var vld = !!val;
        if(vld && req[i].min) vld = (val.length >= req[i].min);
        if(vld && req[i].max) vld = (vld && val.length <= req[i].max);
        if(vld && req[i].list) vld = (req[i].list.indexOf(val) !== -1);
        if(vld && req[i].munCheck) { var dep = document.getElementById("departamento").value; vld = (g_dm[dep] && g_dm[dep].indexOf(val) !== -1); }
        if(!vld) { el.classList.add("error-field"); if(ok) { alert(req[i].msg); el.focus(); } ok = false; } else { el.classList.remove("error-field"); }
    }
    return ok;
}

function g_init() {
    // LISTADO DE TODOS LOS CAMPOS QUE DEBEN ACTUALIZAR EL JSON
    var ids = ["nombre","tel1","tel2","fechaVenta","nit","locZona","locNumero","locAvenida","locReferencia","departamento","municipio","categoria","buscarSku","marca","bodega","canal","ubicacion","anillo","COMENTARIO"];
    for(var i=0; i<ids.length; i++) {
        var el = document.getElementById(ids[i]); if(!el) continue;

        // Asignamos el evento según el tipo de campo
        if(el.tagName === "SELECT") {
            el.onchange = g_sv;
        } else {
            el.oninput = g_sv;
        }

        if(ids[i] === "tel1" || ids[i] === "tel2") el.oninput = g_on_tel_inp;
        if(ids[i] === "fechaVenta") el.onchange = function(){ g_h = new Date().toTimeString().slice(0,8); g_sv(); };
        else if(ids[i] === "departamento") { el.onfocus = g_on_dep_foc; el.oninput = g_on_dep_inp; }
        else if(ids[i] === "municipio") { el.onfocus = g_on_mun_foc; el.oninput = g_on_mun_inp; }
        else if(ids[i] === "categoria") { el.onfocus = g_on_cat_foc; el.oninput = g_on_cat_inp; }
        else if(ids[i] === "buscarSku") { el.onfocus = g_on_sku_focus; el.oninput = g_on_sku_input; }
    }
    document.onmousedown = function(e) { if(e.target.className === "combo-item") return; var ls = document.getElementsByClassName("combo-list"); for(var i=0; i<ls.length; i++) { if(ls[i] !== e.target && ls[i].previousElementSibling !== e.target) ls[i].style.display = "none"; } };
    document.addEventListener('click', function(e) { var btn = e.target.closest('button[type="submit"]'); if(btn && btn.classList.contains('button-element')) { if(!g_vld()) { e.preventDefault(); e.stopPropagation(); } } }, true);
    g_sv();
}
setTimeout(g_init, 100);
</script>
