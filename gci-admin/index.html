<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCI Admin - Plataforma Empresarial</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS Grid & Utility System -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <!-- FontAwesome / Bootstrap Icons / CDN Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Base Styling -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="gci-app-body">
    <div class="gci-layout-topbar">
        <!-- BARRA SUPERIOR HEADER Y LOGO -->
        <header class="glossy-header">
            <div class="header-brand-container">
                <div class="glossy-logo-badge">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div class="brand-text-block">
                    <span class="brand-title">GCI <span class="brand-accent">ADMIN</span></span>
                    <span class="brand-subtitle">Plataforma de Control Empresarial</span>
                </div>
            </div>

            <!-- Badges de Estado Rápido -->
            <div class="quick-status-pills">
                <div class="status-pill" id="pill-supabase" title="Supabase API">
                    <i class="fa-solid fa-circle pill-dot dot-inactive"></i>
                    <span>Supabase</span>
                </div>
                <div class="status-pill" id="pill-sap" title="SAP B1">
                    <i class="fa-solid fa-circle pill-dot dot-inactive"></i>
                    <span>SAP B1</span>
                </div>
                <div class="status-pill" id="pill-sheets" title="Google Sheets / AppScript">
                    <i class="fa-solid fa-circle pill-dot dot-inactive"></i>
                    <span>Sheets</span>
                </div>
                <div class="status-pill" id="pill-onedrive" title="OneDrive Cloud">
                    <i class="fa-solid fa-circle pill-dot dot-inactive"></i>
                    <span>OneDrive</span>
                </div>
                <div class="status-pill" id="pill-waze" title="Waze Traffic API">
                    <i class="fa-solid fa-circle pill-dot dot-inactive"></i>
                    <span>Waze</span>
                </div>
            </div>

            <!-- Acciones de Cabecera: Botón Modal de Conexiones & Perfil -->
            <div class="d-flex align-items-center gap-3">
                <button id="btn-open-connections-modal" class="btn-gci btn-primary" style="padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-plug"></i>
                    <span>Configuración de Conexiones</span>
                </button>

                <div class="user-profile-badge">
                    <div class="user-avatar-glossy">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div class="user-info">
                        <span class="user-name">Administrador GCI</span>
                        <span class="user-role">Super Admin</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- NAVEGACIÓN HORIZONTAL GLOSSY DE MÓDULOS -->
        <nav class="glossy-navbar">
            <ul class="nav-tabs-container">
                <li class="nav-tab-item active" data-module="clientes">
                    <a href="#clientes" class="nav-tab-link tab-cyan">
                        <i class="fa-solid fa-users"></i>
                        <span>CLIENTES</span>
                    </a>
                </li>
                <li class="nav-tab-item" data-module="dashboard">
                    <a href="#dashboard" class="nav-tab-link tab-blue">
                        <i class="fa-solid fa-chart-pie"></i>
                        <span>DASHBOARD</span>
                    </a>
                </li>
                <li class="nav-tab-item" data-module="file-manager">
                    <a href="#file-manager" class="nav-tab-link tab-sky">
                        <i class="fa-solid fa-folder-open"></i>
                        <span>ARCHIVOS LOCALES</span>
                    </a>
                </li>
                <li class="nav-tab-item" data-module="agenda-rutas">
                    <a href="#agenda-rutas" class="nav-tab-link tab-teal">
                        <i class="fa-solid fa-route"></i>
                        <span>AGENDA DE RUTAS</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- ÁREA DE CONTENIDO DINÁMICO CENTRAL -->
        <main class="gci-content-wrapper">
            <div id="gci-content-area" class="gci-content-area">
                <div class="module-loader">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <p>Cargando módulo...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL DE CONFIGURACIÓN DE CONEXIONES API -->
    <div id="connections-modal" class="modal-overlay" style="display: none;">
        <div class="modal-dialog-gci">
            <div class="modal-header-gci">
                <h3><i class="fa-solid fa-plug text-primary"></i> Configuración de Conexiones (APIs & Datos)</h3>
                <button id="btn-close-connections-modal" class="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body-gci" id="connections-modal-body">
                <!-- Se renderizará dinámicamente desde api-config.js -->
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFIGURACIÓN DE CAMPOS DE CLIENTE -->
    <div id="fields-config-modal" class="modal-overlay" style="display: none;">
        <div class="modal-dialog-gci" style="max-width: 950px;">
            <div class="modal-header-gci">
                <h3><i class="fa-solid fa-sliders text-primary"></i> Configuración de Campos de Cliente</h3>
                <button id="btn-close-fields-modal" class="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body-gci" id="fields-modal-body">
                <!-- Se renderiza dinámicamente desde clients.js -->
            </div>
        </div>
    </div>

    <!-- Script Principal JS Modular -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
